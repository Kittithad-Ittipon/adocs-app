name: Build, Push & Deploy ADOCS App

on:
  push:
    branches:
      - main

env:
  BACKEND_PATH: /home/admin/docker-system-container/docker-app/adocs-flask
  FRONTEND_PATH: /home/admin/docker-system-container/docker-app/adocs-next
  SERVER_PATH: /home/admin/docker-system-container/docker-app/server

jobs:
  build-push-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # ===== Build =====
      - name: Build flask image
        run: |
          docker build \
            -t adocsdeploy/flask:latest \
            -t adocsdeploy/flask:${{ github.sha }} \
            -f ./adocs-backend/Dockerfile \
            ./adocs-backend

      - name: Build next image
        run: |
          docker build \
            -t adocsdeploy/next:latest \
            -t adocsdeploy/next:${{ github.sha }} \
            -f ./adocs-frontend/Dockerfile \
            ./adocs-frontend

      - name: Build server-infra image
        run: |
          docker build \
            -t adocsdeploy/server-infra:latest \
            -t adocsdeploy/server-infra:${{ github.sha }} \
            -f ./server-response/Dockerfile \
            ./server-response

      # ===== Push =====
      - name: Push flask image
        run: |
          docker push adocsdeploy/flask:latest
          docker push adocsdeploy/flask:${{ github.sha }}

      - name: Push next image
        run: |
          docker push adocsdeploy/next:latest
          docker push adocsdeploy/next:${{ github.sha }}

      - name: Push server-infra image
        run: |
          docker push adocsdeploy/server-infra:latest
          docker push adocsdeploy/server-infra:${{ github.sha }}

      # ===== Stop =====
      - name: Stop backend
        run: |
          cd "$BACKEND_PATH"
          docker compose down

      - name: Stop frontend
        run: |
          cd "$FRONTEND_PATH"
          docker compose down

      - name: Stop server-infra
        run: |
          cd "$SERVER_PATH"
          docker compose down

      # ===== Cleanup old images =====
      - name: Remove old flask/next/server-infra images
        run: |
          for repo in adocsdeploy/flask adocsdeploy/next adocsdeploy/server-infra; do
            docker images "$repo" --format '{{.ID}} {{.Tag}}' \
              | awk -v sha="${{ github.sha }}" '$2 != "latest" && $2 != sha {print $1}' \
              | sort -u \
              | xargs -r docker rmi -f
          done

      # ===== Start =====
      - name: Start backend
        run: |
          cd "$BACKEND_PATH"
          docker compose pull
          docker compose up -d

      - name: Start frontend
        run: |
          cd "$FRONTEND_PATH"
          docker compose pull
          docker compose up -d

      - name: Start server-infra
        run: |
          cd "$SERVER_PATH"
          docker compose pull
          docker compose up -d